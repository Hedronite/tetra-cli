# rust-tops floor for tetra-cli.
#
# Toolchain: rust-toolchain.toml is the pin. Each job reads its channel and
# hands it to dtolnay/rust-toolchain. No job installs `stable`.
#
# Deny runs the repo scope (advisories, bans, sources). A bare
# `cargo deny check` is for cargo-tops gate locally.
#
# Wrap tests need a real facet binary. CI downloads the pinned Facet v0.8.1
# release, sha256-checks it against SHA256SUMS, and exports FACET_BIN.
#
# Every action is pinned by commit SHA, with its tag as a trailing comment.
name: rust-tops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FACET_RELEASE: "0.8.1"

jobs:
  rust-tops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            cmake
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Install Facet v0.8.1 and export FACET_BIN
        run: |
          set -euo pipefail
          asset="facet-cli-${FACET_RELEASE}-linux-x64.tar.gz"
          expected="21522fb9f54a79d03f8003b61434e27d74db4265ba85c9933dc04388cfaf867c"
          curl -fsSL -o "${asset}" "https://github.com/Hedronite/facet/releases/download/v${FACET_RELEASE}/${asset}"
          curl -fsSL -o SHA256SUMS "https://github.com/Hedronite/facet/releases/download/v${FACET_RELEASE}/SHA256SUMS"
          grep " ${asset}$" SHA256SUMS | sha256sum -c -
          echo "${expected}  ${asset}" | sha256sum -c -
          mkdir -p "${HOME}/.local/facet"
          tar -xzf "${asset}" -C "${HOME}/.local/facet"
          test -x "${HOME}/.local/facet/facet"
          echo "FACET_BIN=${HOME}/.local/facet/facet" >> "${GITHUB_ENV}"
          "${HOME}/.local/facet/facet" --version
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo deny
        run: cargo deny --workspace check advisories bans sources
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: msrv cargo check
        run: cargo check --workspace --all-features --locked
