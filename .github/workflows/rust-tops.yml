# rust-tops floor for tetra-cli.
#
# Toolchain: rust-toolchain.toml is the pin. Each job reads its channel and
# hands it to dtolnay/rust-toolchain. No job installs `stable`.
#
# Deny runs the repo scope (advisories, bans, sources). A bare
# `cargo deny check` is for cargo-tops gate locally.
#
# Wrap and apply-split tests need a real facet binary that understands
# `apply --frozen`. CI builds Facet from FACET_REV on a cache miss and
# exports FACET_BIN. The cache stores only that binary.
#
# Every action is pinned by commit SHA, with its tag as a trailing comment.
name: rust-tops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FACET_REV: "0d66def5ede4fcfaece8a38a898a529062f8212b"

jobs:
  rust-tops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            cmake
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Cache Facet binary
        id: facet-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/facet-bin
          key: facet-bin-${{ env.FACET_REV }}-${{ runner.os }}
      - name: Build Facet from FACET_REV
        if: steps.facet-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/facet-bin"
          git clone --filter=blob:none https://github.com/Hedronite/facet "${RUNNER_TEMP}/facet-src"
          git -C "${RUNNER_TEMP}/facet-src" checkout "${FACET_REV}"
          test "$(git -C "${RUNNER_TEMP}/facet-src" rev-parse HEAD)" = "${FACET_REV}"
          (
            cd "${RUNNER_TEMP}/facet-src"
            cargo build --locked -p facet-cli --bin facet
          )
          cp "${RUNNER_TEMP}/facet-src/target/debug/facet" "${RUNNER_TEMP}/facet-bin/facet"
          chmod +x "${RUNNER_TEMP}/facet-bin/facet"
      - name: Export FACET_BIN
        run: |
          set -euo pipefail
          test -x "${RUNNER_TEMP}/facet-bin/facet"
          echo "FACET_BIN=${RUNNER_TEMP}/facet-bin/facet" >> "${GITHUB_ENV}"
          "${RUNNER_TEMP}/facet-bin/facet" --version
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo deny
        run: cargo deny --workspace check advisories bans sources
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: msrv cargo check
        run: cargo check --workspace --all-features --locked
