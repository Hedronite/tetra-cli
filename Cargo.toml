[workspace]
resolver = "2"
members = ["crates/tetractl", "crates/hedron-ncl"]
exclude = ["vendor/nickel-lang-vector"]

[workspace.package]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
nickel-lang-vector = { path = "vendor/nickel-lang-vector" }
