[package]
name = "tetractl"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "World command for the Hedronite platform. Nickel is the language; tetractl wraps Facet/Hedron/kubectl as they are."
repository = "https://github.com/Hedronite/tetra-cli"
homepage = "https://github.com/Hedronite/tetra-cli"
readme = "../../README.md"
keywords = ["hedronite", "nickel", "cli"]
categories = ["command-line-utilities"]
publish = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "tetractl"
path = "src/lib.rs"

[[bin]]
name = "tetractl"
path = "src/main.rs"

[[bin]]
name = "tetra"
path = "src/main.rs"

[dependencies]
hedron-ncl = { path = "../hedron-ncl" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"
