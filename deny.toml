# cargo-deny policy. Everything not set here uses the cargo-deny defaults.
#
# Scope: CI runs `cargo deny --workspace check advisories bans sources` over the whole workspace.
# cargo-tops gate also runs a bare `cargo deny check`, so licenses are listed below.
[graph]
all-features = true

[advisories]
ignore = [
  # Review by 2026-12-31 (cargo-deny has no expiry field, so the date lives in this comment).
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained proc-macro with no known vulnerability. It comes in via nickel-lang-core 0.18 (through hedron-ncl). nickel-lang-core 0.19 drops paste; bumping hedron-ncl to it is a separate follow-up that can remove this ignore. Review by 2026-12-31." },

  # Review by 2027-01-31. No patched release exists (RUSTSEC-2024-0449).
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is an archived c2rust port of libyaml with no patched release. nickel-lang-core 0.18 via hedron-ncl still depends on serde_yaml 0.9.34. Replacing that pin with a safe parser is not a small, behavior-preserving change. Review by 2027-01-31." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
]

# nickel-lang-core 0.18 depends on malachite 0.9 (LGPL-3.0-only). Scoped so the
# workspace does not globally allow LGPL-3.0-only.
[[licenses.exceptions]]
name = "malachite"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-base"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-nz"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-q"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-float"
allow = ["LGPL-3.0-only"]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
